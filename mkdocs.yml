
site_name: Knowledge Hub
site_description: Practical technical knowledge for program managers, engineers, and Earth observation practitioners
site_url: https://chaitanyaj14.github.io/knowledge-hub/

repo_name: chaitanyaj14/knowledge-hub
repo_url: https://github.com/chaitanyaj14/knowledge-hub

theme:
